[pytest]
asyncio_mode = auto
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Set minimal env vars for tests that need config (no real DB needed for unit tests)
env =
    GROQ_API_KEY=test_key_for_unit_tests
    JWT_SECRET_KEY=test-secret-key-minimum-32-chars-long-for-pytest
    CHINOOK_DB_URL=postgresql+asyncpg://chinook_ro:readonlypass@localhost:5432/chinook
    APP_DB_URL=postgresql+asyncpg://appuser:apppass@localhost:5432/app_db
    APP_DB_SYNC_URL=postgresql://appuser:apppass@localhost:5432/app_db
