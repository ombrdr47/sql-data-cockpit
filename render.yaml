services:
  - type: web
    name: sql-data-cockpit-backend
    env: docker
    dockerfilePath: ./Dockerfile.backend
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://sql-data-cockpit.vercel.app"
      - key: ENVIRONMENT
        value: production
      - key: SECURE_COOKIES
        value: true
      - key: CHINOOK_DB_URL
        sync: false
      - key: APP_DB_URL
        sync: false
      - key: APP_DB_SYNC_URL
        sync: false
